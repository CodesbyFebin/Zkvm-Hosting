name: omni-loop-swarm-engine CI

on:
  push:
    paths:
      - "omni-loop-swarm-engine/**"
      - ".github/workflows/omni-loop-ci.yml"
  pull_request:
    paths:
      - "omni-loop-swarm-engine/**"

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: omni-loop-swarm-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest test_swarm.py test_llm.py test_app.py -v

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: omni-loop-swarm-engine/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: omni-loop-swarm-engine/frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t omni-loop-swarm-engine:ci ./omni-loop-swarm-engine
