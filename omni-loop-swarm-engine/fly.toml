# Fly.io app config. `app` is Fly's own app name (gives you the default
# <app>.fly.dev URL) -- it's separate from the intended custom domain,
# swarm.zkvm.host. Fly app names are globally unique and can't be verified
# from here, so confirm this one is actually free (`fly apps list` after
# `fly auth login`, or just try `fly launch --no-deploy` and let it tell
# you) before your first deploy. After that, wire up the real domain:
#   fly certs add swarm.zkvm.host
# then add a CNAME for swarm -> <app>.fly.dev in zkvm.host's DNS (wherever
# that's managed -- Vercel, since the main zkvm.host site is a Vercel
# project elsewhere in this repo, not Fly).
app = "swarm-zkvm-host"
primary_region = "iad"

[build]

[env]
  PORT = "5000"
  FLASK_DEBUG = "false"

[http_service]
  internal_port = 5000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/api/health"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
