<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" font-family="'Inter','SF Pro Display',-apple-system,sans-serif">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="45%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M 42 0 L 0 0 0 42" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="640" fill="#06060a"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <circle cx="980" cy="150" r="320" fill="url(#glow1)"/>
  <circle cx="180" cy="520" r="260" fill="url(#glow2)"/>

  <!-- Hexagon Z mark -->
  <g transform="translate(112,54)">
    <polygon points="34,2 62,18 62,50 34,66 6,50 6,18" fill="none" stroke="url(#grad1)" stroke-width="2.4"/>
    <text x="34" y="44" text-anchor="middle" font-size="30" font-weight="700" fill="url(#grad1)" font-family="'IBM Plex Mono',monospace">Z</text>
  </g>

  <!-- Wordmark -->
  <text x="192" y="90" font-size="52" font-weight="800" fill="#ffffff" letter-spacing="1">RUST <tspan fill="url(#grad1)">STARK</tspan></text>
  <text x="192" y="150" font-size="52" font-weight="800" fill="#ffffff" letter-spacing="1">ZKVM</text>

  <text x="112" y="204" font-size="21" fill="#c7c9d9" font-weight="400">STARK-Verifiable Virtual Machine for Provable Computation</text>

  <text x="112" y="244" font-size="14.5" font-weight="600" letter-spacing="1.5" font-family="'IBM Plex Mono',monospace">
    <tspan fill="#c4b5fd">OPEN SOURCE</tspan><tspan fill="#5b5f78"> &#8226; </tspan><tspan fill="#a78bfa">MIT LICENSED</tspan><tspan fill="#5b5f78"> &#8226; </tspan><tspan fill="#67e8f9">NO SECRET WITNESS</tspan>
  </text>

  <!-- Verified-proof emblem, right side -->
  <g transform="translate(980,150)">
    <circle r="108" fill="none" stroke="url(#grad2)" stroke-width="1.6" opacity="0.55"/>
    <circle r="78" fill="#0d0d1f" stroke="#2a2a45" stroke-width="1"/>
    <path d="M -30,2 L -8,26 L 34,-24" fill="none" stroke="url(#grad2)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="0" y="-134" text-anchor="middle" font-size="11" font-family="'IBM Plex Mono',monospace" fill="#8b8fae" letter-spacing="2">REAL STARK PROOF</text>

    <!-- three real access-surface nodes, explicitly labeled (not a P2P network) -->
    <g font-family="'IBM Plex Mono',monospace" font-size="12" fill="#c7c9d9">
      <line x1="0" y1="0" x2="-190" y2="-70" stroke="#3a3d5c" stroke-width="1.2"/>
      <circle cx="-190" cy="-70" r="5" fill="#a78bfa"/>
      <text x="-186" y="-76">CLI</text>

      <line x1="0" y1="0" x2="-210" y2="60" stroke="#3a3d5c" stroke-width="1.2"/>
      <circle cx="-210" cy="60" r="5" fill="#67e8f9"/>
      <text x="-206" y="54">HTTP API</text>

      <line x1="0" y1="0" x2="70" y2="100" stroke="#3a3d5c" stroke-width="1.2"/>
      <circle cx="70" cy="100" r="5" fill="#a78bfa"/>
      <text x="84" y="104">MCP</text>
    </g>
  </g>

  <!-- Feature row -->
  <g font-family="'Inter',sans-serif">
    <!-- card template positions: 6 cards across, y=300..398 -->
    <g transform="translate(56,300)">
      <rect width="190" height="98" rx="10" fill="#0d0d14" stroke="#1c1c2c"/>
      <text x="16" y="30" font-size="13.5" font-weight="700" fill="#e6e6f0">Verifiable Compute</text>
      <text x="16" y="52" font-size="11" fill="#8b8fae">Re-executed and</text>
      <text x="16" y="67" font-size="11" fill="#8b8fae">checked, not just claimed</text>
    </g>
    <g transform="translate(258,300)">
      <rect width="190" height="98" rx="10" fill="#0d0d14" stroke="#1c1c2c"/>
      <text x="16" y="30" font-size="13.5" font-weight="700" fill="#e6e6f0">Real STARK Proofs</text>
      <text x="16" y="52" font-size="11" fill="#8b8fae">FRI-based, built on</text>
      <text x="16" y="67" font-size="11" fill="#8b8fae">Winterfell</text>
    </g>
    <g transform="translate(460,300)">
      <rect width="190" height="98" rx="10" fill="#0d0d14" stroke="#1c1c2c"/>
      <text x="16" y="30" font-size="13.5" font-weight="700" fill="#e6e6f0">CLI + HTTP + MCP</text>
      <text x="16" y="52" font-size="11" fill="#8b8fae">Three real ways to</text>
      <text x="16" y="67" font-size="11" fill="#8b8fae">prove and verify</text>
    </g>
    <g transform="translate(662,300)">
      <rect width="190" height="98" rx="10" fill="#0d0d14" stroke="#1c1c2c"/>
      <text x="16" y="30" font-size="13.5" font-weight="700" fill="#e6e6f0">On-Chain Attestation</text>
      <text x="16" y="52" font-size="11" fill="#8b8fae">A documented trust</text>
      <text x="16" y="67" font-size="11" fill="#8b8fae">bridge, not a black box</text>
    </g>
    <g transform="translate(864,300)">
      <rect width="190" height="98" rx="10" fill="#0d0d14" stroke="#1c1c2c"/>
      <text x="16" y="30" font-size="13.5" font-weight="700" fill="#e6e6f0">No Secret Witness</text>
      <text x="16" y="52" font-size="11" fill="#8b8fae">The verifier checks</text>
      <text x="16" y="67" font-size="11" fill="#8b8fae">everything itself</text>
    </g>
    <g transform="translate(1034,300)">
      <rect width="190" height="98" rx="10" fill="#0d0d14" stroke="#1c1c2c"/>
      <text x="16" y="30" font-size="13.5" font-weight="700" fill="#e6e6f0">Open Roadmap</text>
      <text x="16" y="52" font-size="11" fill="#8b8fae">Every gap named,</text>
      <text x="16" y="67" font-size="11" fill="#8b8fae">nothing hidden</text>
    </g>
  </g>

  <!-- Repo info bar -->
  <g transform="translate(56,438)">
    <rect width="1168" height="64" rx="10" fill="#0d0d14" stroke="#1c1c2c"/>
    <g transform="translate(24,20)">
      <path d="M12 0C5.4 0 0 5.6 0 12.5c0 5.5 3.4 10.1 8.2 11.8.6.1.8-.3.8-.6v-2.2c-3.3.8-4-1.6-4-1.6-.6-1.4-1.4-1.8-1.4-1.8-1.1-.8.1-.8.1-.8 1.2.1 1.9 1.3 1.9 1.3 1.1 2 2.9 1.4 3.6 1 .1-.8.4-1.4.8-1.7-2.6-.3-5.4-1.4-5.4-6.1 0-1.4.5-2.5 1.2-3.4-.1-.3-.5-1.5.1-3.1 0 0 1-.3 3.3 1.3a11 11 0 0 1 6 0c2.3-1.6 3.3-1.3 3.3-1.3.6 1.6.2 2.8.1 3.1.8.9 1.2 2 1.2 3.4 0 4.7-2.8 5.8-5.5 6.1.4.4.8 1.1.8 2.3v3.4c0 .3.2.7.8.6C20.6 22.6 24 18 24 12.5 24 5.6 18.6 0 12 0z" fill="#c7c9d9"/>
    </g>
    <text x="58" y="30" font-size="15" fill="#e6e6f0" font-family="'IBM Plex Mono',monospace">github.com/CodesbyFebin/<tspan fill="url(#grad1)" font-weight="700">rust-stark-zkvm</tspan></text>

    <g font-family="'IBM Plex Mono',monospace" font-size="12.5" fill="#8b8fae">
      <text x="470" y="20">&#9733; Open Source</text>
      <text x="470" y="40">MIT License</text>
      <text x="650" y="20">Actively Developed</text>
      <text x="650" y="40">Single Maintainer</text>
      <text x="880" y="20">Every Claim Checkable</text>
      <text x="880" y="40">See docs/ROADMAP.md</text>
    </g>
  </g>

  <!-- Tech badges -->
  <g transform="translate(56,522)" font-family="'IBM Plex Mono',monospace" font-size="13" font-weight="600">
    <g transform="translate(0,0)"><rect width="90" height="34" rx="8" fill="#1a1220" stroke="#3a2540"/><text x="45" y="22" text-anchor="middle" fill="#e8a87c">Rust</text></g>
    <g transform="translate(100,0)"><rect width="130" height="34" rx="8" fill="#141a2a" stroke="#25355a"/><text x="65" y="22" text-anchor="middle" fill="#8fb3f0">Winterfell</text></g>
    <g transform="translate(240,0)"><rect width="94" height="34" rx="8" fill="#1a1428" stroke="#3a2a55"/><text x="47" y="22" text-anchor="middle" fill="#c4b5fd">STARK</text></g>
    <g transform="translate(344,0)"><rect width="70" height="34" rx="8" fill="#0d1a1a" stroke="#1f3a3a"/><text x="35" y="22" text-anchor="middle" fill="#6ee7e7">CLI</text></g>
    <g transform="translate(424,0)"><rect width="150" height="34" rx="8" fill="#141a2a" stroke="#25355a"/><text x="75" y="22" text-anchor="middle" fill="#8fb3f0">MCP Server</text></g>
    <g transform="translate(584,0)"><rect width="130" height="34" rx="8" fill="#0d1a1a" stroke="#1f3a3a"/><text x="65" y="22" text-anchor="middle" fill="#6ee7e7">HTTP API</text></g>
    <g transform="translate(724,0)"><rect width="110" height="34" rx="8" fill="#1a1428" stroke="#3a2a55"/><text x="55" y="22" text-anchor="middle" fill="#c4b5fd">Solidity</text></g>
    <g transform="translate(844,0)"><rect width="120" height="34" rx="8" fill="#141a2a" stroke="#25355a"/><text x="60" y="22" text-anchor="middle" fill="#8fb3f0">Ethereum</text></g>
  </g>

  <text x="640" y="600" text-anchor="middle" font-size="13" font-family="'IBM Plex Mono',monospace" letter-spacing="2.5" fill="#5b5f78">OPEN SOURCE &#8226; HONESTLY SCOPED &#8226; EVERY CLAIM VERIFIED</text>
</svg>
