<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 620" font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
  <rect width="860" height="620" fill="#05060a"/>

  <!-- palette: box fill #10131a, box stroke #2c3542, accent fill #0c1f16, accent stroke #34c485, text #d7dee6, muted #8b96a3, accent text #6fe3a3 -->

  <!-- .zkasm source -->
  <rect x="330" y="16" width="200" height="48" rx="6" fill="#10131a" stroke="#2c3542"/>
  <text x="430" y="45" text-anchor="middle" font-size="14" fill="#d7dee6">program.zkasm</text>

  <line x1="430" y1="64" x2="430" y2="96" stroke="#3a4452" stroke-width="1.5"/>
  <polygon points="430,100 424,90 436,90" fill="#3a4452"/>

  <!-- zkvm-isa -->
  <rect x="195" y="104" width="470" height="70" rx="6" fill="#10131a" stroke="#2c3542"/>
  <text x="430" y="130" text-anchor="middle" font-size="14" font-weight="bold" fill="#d7dee6">zkvm-isa</text>
  <text x="430" y="150" text-anchor="middle" font-size="11.5" fill="#8b96a3">interpreter · execution trace (acc, registers, control flow)</text>

  <line x1="430" y1="174" x2="430" y2="206" stroke="#3a4452" stroke-width="1.5"/>
  <polygon points="430,210 424,200 436,200" fill="#3a4452"/>

  <!-- zkvm-stark -->
  <rect x="130" y="214" width="600" height="80" rx="6" fill="#0c1f16" stroke="#34c485"/>
  <text x="430" y="240" text-anchor="middle" font-size="14" font-weight="bold" fill="#6fe3a3">zkvm-stark</text>
  <text x="430" y="260" text-anchor="middle" font-size="11.5" fill="#8fd6b3">AIR + STARK prover/verifier (Winterfell) — real proof, ~11 KB, sub-10ms verify</text>
  <text x="430" y="280" text-anchor="middle" font-size="10.5" fill="#5c9c7c">no lookup/permutation gadget needed — see the doc comment in src/lib.rs for why</text>

  <line x1="430" y1="294" x2="430" y2="318" stroke="#3a4452" stroke-width="1.5"/>
  <polygon points="430,322 424,312 436,312" fill="#3a4452"/>

  <!-- three access surfaces -->
  <rect x="40" y="330" width="230" height="80" rx="6" fill="#10131a" stroke="#2c3542"/>
  <text x="155" y="356" text-anchor="middle" font-size="13" font-weight="bold" fill="#d7dee6">zkvm-cli</text>
  <text x="155" y="374" text-anchor="middle" font-size="11" fill="#8b96a3">run · prove · verify</text>
  <text x="155" y="390" text-anchor="middle" font-size="11" fill="#8b96a3">deploy · demo</text>

  <rect x="315" y="330" width="230" height="80" rx="6" fill="#10131a" stroke="#2c3542"/>
  <text x="430" y="356" text-anchor="middle" font-size="13" font-weight="bold" fill="#d7dee6">zkvm-host-server</text>
  <text x="430" y="374" text-anchor="middle" font-size="11" fill="#8b96a3">HTTP: /v1/proofs</text>
  <text x="430" y="390" text-anchor="middle" font-size="11" fill="#8b96a3">/v1/verify · /v1/backends</text>

  <rect x="590" y="330" width="230" height="80" rx="6" fill="#10131a" stroke="#2c3542"/>
  <text x="705" y="356" text-anchor="middle" font-size="13" font-weight="bold" fill="#d7dee6">MCP tools</text>
  <text x="705" y="374" text-anchor="middle" font-size="11" fill="#8b96a3">prove · verify</text>
  <text x="705" y="390" text-anchor="middle" font-size="11" fill="#8b96a3">for Claude, Cursor, ...</text>

  <line x1="270" y1="326" x2="180" y2="316" stroke="#3a4452" stroke-width="1.5"/>
  <line x1="590" y1="326" x2="680" y2="316" stroke="#3a4452" stroke-width="1.5"/>

  <line x1="155" y1="410" x2="155" y2="440" stroke="#3a4452" stroke-width="1.5"/>
  <line x1="430" y1="410" x2="430" y2="440" stroke="#3a4452" stroke-width="1.5"/>
  <line x1="705" y1="410" x2="705" y2="440" stroke="#3a4452" stroke-width="1.5"/>
  <line x1="155" y1="440" x2="705" y2="440" stroke="#3a4452" stroke-width="1.5"/>
  <line x1="430" y1="440" x2="430" y2="464" stroke="#3a4452" stroke-width="1.5"/>
  <polygon points="430,468 424,458 436,458" fill="#3a4452"/>
  <text x="440" y="452" font-size="10.5" fill="#6b7684">proof + public inputs</text>

  <!-- onchain_demo.sh path -->
  <rect x="230" y="476" width="400" height="66" rx="6" fill="#10131a" stroke="#2c3542"/>
  <text x="430" y="500" text-anchor="middle" font-size="13" font-weight="bold" fill="#d7dee6">scripts/onchain_demo.sh</text>
  <text x="430" y="518" text-anchor="middle" font-size="11" fill="#8b96a3">verify locally, then attest the result on-chain</text>

  <line x1="430" y1="542" x2="430" y2="570" stroke="#34c485" stroke-width="1.5"/>
  <polygon points="430,574 424,564 436,564" fill="#34c485"/>

  <!-- contracts -->
  <rect x="105" y="580" width="650" height="34" rx="6" fill="#0c1f16" stroke="#34c485"/>
  <text x="430" y="601" text-anchor="middle" font-size="12" fill="#6fe3a3">contracts/ — AttestedVerifier + ProofOrchestrator (task, reward, on-chain record)</text>
</svg>
