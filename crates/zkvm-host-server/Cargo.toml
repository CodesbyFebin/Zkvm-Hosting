[package]
name = "zkvm-host-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "HTTP + MCP proving service for the zkvm-isa/zkvm-stark STARK prover"

[[bin]]
name = "zkvm-host-server"
path = "src/main.rs"

[dependencies]
zkvm-isa = { path = "../zkvm-isa" }
zkvm-stark = { path = "../zkvm-stark" }
winter-utils = "0.13.1"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
async-trait = "0.1"
thiserror = "2"
rmcp = { version = "3.1", features = ["server", "macros", "transport-streamable-http-server"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto"] }
tower = { version = "0.5", features = ["limit"] }
tower-http = { version = "0.7", features = ["timeout"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util", "limit"] }
http-body-util = "0.1"
